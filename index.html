    :root{--ink:#163750;--blue:#2675d7;--navy:#164579;--cream:#fff9e9;--green:#168a60;--gold:#ffd35a;--wood:#b96c3e}

    .primary svg,.secondary svg{width:19px;height:19px}

    .quest-board{background:#fff8e9;border:6px solid #ae683c;border-radius:20px;box-shadow:inset 0 0 0 3px #e6a968,0 8px 0 #834925,0 14px 28px #5b725f35;padding:22px;position:relative}

    .quest-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}.quest-actions .primary{padding:10px 18px;font-size:14px;box-shadow:0 4px 0 #be8426}.quest-actions .secondary{font-size:13px}

    .mini-list{padding:0;margin:0;list-style:none}.mini-list li{padding:8px 0;border-top:1px solid #dcebe9;font-size:13px;font-weight:800;display:flex;gap:8px;align-items:center}.mini-list .completed{color:#168a60}

  const zones=[
    {id:"masyarakat",name:"Balai Warga",icon:"🏡",subtitle:"Musyawarah & gotong royong",npc:"Pak RT",npcIcon:"👨🏽‍💼",intro:"Selamat datang! Warga ingin membuat lingkungan lebih bersih. Bantu Pak RT mencari keputusan yang adil untuk semua.",label:"ZONA 1 · MASYARAKAT",accent:"#62b978",
      questions:[
        {q:"Warga punya usul berbeda tentang jadwal kerja bakti. Apa yang kamu lakukan lebih dulu?",a:["Mendengarkan pendapat semua warga sebelum menentukan pilihan.","Memotong pembicaraan agar usulku segera diterima.","Memilih usul teman dekat tanpa mendengar warga lain.","Pergi karena pendapat orang lain berbeda."],correct:0,good:"Tepat! Musyawarah dimulai dengan mendengarkan semua pendapat agar keputusan mempertimbangkan kepentingan bersama.",hint:"Dalam musyawarah, setiap warga berhak didengar. Coba pilih tindakan yang memberi ruang bagi semua orang."},
        {q:"Kamu ingin mengusulkan tempat sampah baru. Bagaimana cara menyampaikannya?",a:["Berteriak supaya semua orang mengikuti usulku.","Mengatakan, “Menurut saya, tempat sampah bisa diletakkan dekat jalan. Bagaimana pendapat yang lain?”","Mengejek usul warga yang berbeda.","Diam saja lalu mengeluh setelah rapat."],correct:1,good:"Bagus! Menyampaikan pendapat dengan sopan dan mengundang tanggapan adalah norma yang baik saat bermusyawarah.",hint:"Pilih kalimat yang sopan dan menghargai kesempatan orang lain untuk menanggapi."},
        {q:"Hasil musyawarah menetapkan kerja bakti pada hari Sabtu, meski kamu lebih suka Minggu. Sikapmu?",a:["Mengajak warga membatalkan keputusan diam-diam.","Tidak mau ikut karena usulku tidak dipilih.","Menerima keputusan bersama dan ikut sesuai kemampuan.","Mengejek keputusan rapat."],correct:2,good:"Benar! Mufakat perlu diterima dengan lapang dada. Ikut bekerja sama menunjukkan tanggung jawab sebagai warga.",hint:"Keputusan bersama perlu dihormati walaupun bukan pilihan pribadi kita."},
        {q:"Saat kerja bakti, beberapa warga kesulitan mengangkat pot tanaman. Apa tindakanmu?",a:["Membiarkan karena bukan tugas pribadi.","Membantu sesuai kemampuan dan mengajak teman bekerja sama.","Menonton sambil menertawakan mereka.","Pulang tanpa memberi tahu siapa pun."],correct:1,good:"Hebat! Gotong royong berarti saling membantu demi lingkungan yang nyaman untuk semua.",hint:"Pikirkan cara membantu bersama-sama dengan aman dan sesuai kemampuan."}
      ]},
    {id:"sekolah",name:"Sekolah Ceria",icon:"🏫",subtitle:"Hak, kewajiban & tata tertib",npc:"Bu Guru",npcIcon:"👩🏽‍🏫",intro:"Hari ini kelasmu punya jadwal piket. Ayo tunjukkan cara menjadi murid yang bertanggung jawab!",label:"ZONA 2 · SEKOLAH",accent:"#e6ab4c",
      questions:[
        {q:"Namamu tercantum dalam jadwal piket kelas hari ini. Apa yang kamu lakukan?",a:["Pulang duluan tanpa memberi tahu teman.","Menyapu dan merapikan kelas bersama kelompok piket.","Meminta teman mengerjakan semua tugasmu.","Menyembunyikan alat kebersihan."],correct:1,good:"Tepat! Menjalankan piket adalah kewajiban sekaligus bentuk tanggung jawab menjaga ruang belajar.",hint:"Jadwal piket adalah tugas bersama. Pilih tindakan yang menunjukkan tanggung jawab."},
        {q:"Saat guru menjelaskan pelajaran, hak apa yang dimiliki semua siswa?",a:["Mendapat kesempatan belajar dan bertanya dengan tertib.","Berbicara keras kapan saja tanpa mendengar guru.","Melarang teman lain mengajukan pertanyaan.","Mengambil buku milik teman tanpa izin."],correct:0,good:"Benar! Mendapat pembelajaran adalah hak siswa. Agar semua dapat menikmatinya, kita juga wajib menjaga ketertiban.",hint:"Hak adalah sesuatu yang layak diterima. Mana pilihan yang memberi kesempatan belajar bagi semua?"},
        {q:"Di lorong sekolah ada aturan berjalan dengan tertib. Temanmu mengajak berlari kencang. Apa pilihanmu?",a:["Ikut berlari supaya tidak tertinggal.","Mendorong teman agar cepat sampai.","Mengajak teman berjalan tertib demi keselamatan bersama.","Meneriaki petugas sekolah."],correct:2,good:"Bagus! Mematuhi tata tertib menjaga keselamatan dan menghargai hak teman menggunakan lorong dengan aman.",hint:"Aturan di lorong dibuat agar semua orang aman. Pilih sikap yang menghormatinya."},
        {q:"Setelah piket, kamu menemukan sapu belum dikembalikan. Apa yang sebaiknya dilakukan?",a:["Membiarkannya di tengah lorong.","Menyalahkan teman tanpa mencari tahu.","Mengembalikan sapu ke tempatnya agar siap dipakai lagi.","Menyembunyikannya di belakang kelas."],correct:2,good:"Hebat! Merawat dan mengembalikan alat bersama adalah tanggung jawab yang membantu seluruh warga sekolah.",hint:"Alat kebersihan milik bersama perlu disimpan rapi setelah digunakan."}
      ]},
    {id:"rumah",name:"Rumah Hangat",icon:"🏠",subtitle:"Norma & peran dalam keluarga",npc:"Ibu",npcIcon:"👩🏽",intro:"Di rumah, setiap anggota keluarga saling menyayangi dan membantu. Yuk, selesaikan rutinitas bersama Ibu!",label:"ZONA 3 · RUMAH",accent:"#ef9278",
      questions:[

        {q:"Kamu ingin meminjam barang milik kakak. Bagaimana cara berbicara yang sopan?",a:["“Aku ambil saja, tidak perlu izin.”","“Berikan sekarang!”","“Kak, bolehkah aku meminjamnya sebentar? Terima kasih.”","Mengambilnya diam-diam."],correct:2,good:"Bagus! Meminta izin dan berterima kasih menunjukkan norma kesopanan terhadap anggota keluarga.",hint:"Kata 'bolehkah' dan 'terima kasih' membantu kita menghargai orang lain."},
        {q:"Manakah contoh hak anak di rumah?",a:["Mendapat kasih sayang dan perhatian dari keluarga.","Membiarkan orang tua mengerjakan semua tugas.","Mengabaikan aturan rumah sesuka hati.","Berbicara tidak sopan kepada keluarga."],correct:0,good:"Benar! Kasih sayang dan perhatian adalah hak anak. Hak berjalan berdampingan dengan kewajiban menghormati keluarga.",hint:"Hak adalah sesuatu yang patut kamu terima, bukan tindakan yang merugikan keluarga."},

      ]}

    if(kind==="sekolah")return bg+`${poly("171,367 556,171 944,366 560,561","#f6e5be","#cbbd91")}${poly("202,337 560,159 912,338 560,512","#fff5d7","#d4c8a4")}${poly("202,337 202,180 560,4 560,159","#fbeac8","#cab890")}${poly("560,159 560,4 912,180 912,338","#fff6dc","#d1c3a5")}${poly("354,255 354,150 545,55 545,159","#356957","#214b43",5)}${poly("357,254 544,158 544,164 357,261","#bc8154","#8d6046")}${poly("640,135 810,220 810,293 640,208","#9cd4ee","#6897ad",5)}${poly("656,162 794,229 794,263 656,195","#d3f2ff","#84b6c7")}${poly("355,367 450,319 525,356 430,404","#bd8758","#805c43",5)}${poly("355,367 430,404 430,419 355,383","#936743","#805c43")}${poly("565,414 663,363 738,400 639,452","#bd8758","#805c43",5)}${poly("565,414 639,452 639,469 565,430","#936743","#805c43")}${poly("708,303 769,273 810,294 748,327","#bd8758","#805c43")}${rect(819,314,77,116,"#f0bd60","#ac7d45",5)}${line(834,325,834,425,"#98724b",6)}<path d="M835 416l-17 28h35z" fill="#9b774a" stroke="#805c43" stroke-width="4"/>${person(466,499,1.55,"student")}${person(721,506,1.24,"teacher")}`;
    return bg+`${poly("170,355 556,162 948,357 562,553","#f4d9ae","#bf9f78")}${poly("170,355 170,158 556,-31 556,162","#ffebd0","#d0b38f")}${poly("556,162 556,-31 948,164 948,357","#fff1d7","#d0b38f")}${poly("292,296 412,236 508,284 388,346","#68b6a7","#508d83",5)}${poly("292,296 388,346 388,385 292,336","#398e85","#39786d")}${poly("388,346 508,284 508,326 388,385","#4aa699","#39786d")}${poly("300,257 414,200 508,248 393,306","#7fd0bf","#508d83")}${poly("558,359 684,296 799,353 674,418","#dba769","#986e4a",5)}${poly("558,359 674,418 674,434 558,377","#a9784c","#865e3e")}${poly("674,418 799,353 799,372 674,434","#b78554","#865e3e")}${poly("694,338 719,325 739,335 713,349","#fef6e5","#cfbca2")}${poly("625,357 649,345 670,356 645,370","#fef6e5","#cfbca2")}${rect(430,98,91,91,"#fff8df","#b59466",8)}<circle cx="475" cy="143" r="35" fill="#fff" stroke="#b59466" stroke-width="4"/>${line(475,143,475,119,"#385d6b",4)}${line(475,143,493,153,"#385d6b",4)}${rect(733,145,98,115,"#be8758","#926841",4)}${rect(755,169,55,42,"#faeabb","#957651",3)}${person(395,488,1.42,"student")}${person(808,480,1.43,"mom")}${tree(135,400,.8)}`;
  }
  function renderScene(){let view=state.view,kind=view==="quest"||view==="zoneDone"?zones[state.zone].id:null;$("scene-svg").innerHTML=kind?detailScene(kind):worldScene();$("visual-stage").setAttribute("aria-label",kind?`Ilustrasi voxel zona ${zones[state.zone].name}`:"Peta tiga pulau terapung bergaya voxel: rumah, sekolah, dan balai warga");$("stage-label").textContent=kind?zones[state.zone].label:"DUNIA PETUALANGAN";$("stage-chip").textContent=kind?"QUEST ROLEPLAY":"FASE C · KELAS 5";$("stage-bottom").textContent=kind?({masyarakat:"🤝 Dengarkan • Diskusikan • Gotong royong",sekolah:"🧹 Belajar • Piket • Tertib",rumah:"💛 Sopan • Peduli • Bertanggung jawab"}[kind]):"✨ Jelajahi • Pilih • Belajar"}
  function render(){ $("score-display").textContent=state.score;$("zone-display").textContent=state.done.filter(Boolean).length;renderScene();let out="";
    if(state.view==="start")out=`<div class="welcome"><div><p class="eyebrow">Game edukasi interaktif · Pendidikan Pancasila</p><h1 id="page-title">Petualangan Pancasila!</h1><p class="lead">Jadilah pahlawan kebaikan! Jelajahi rumah, sekolah, dan balai warga. Pilih tindakan yang tepat untuk menjaga hak, menjalankan kewajiban, dan bermusyawarah.</p><p id="start-creator-credit" class="creator-credit canva-text">Pembuat: Siti Anggita Agustiani, M.Pd.</p></div><div class="start-actions"><label for="player-name">Nama Pemain</label><input id="player-name" class="canva-input" type="text" maxlength="40" autocomplete="name" placeholder="Masukkan nama kamu" value="${esc(state.playerName)}" aria-describedby="name-error"><p id="name-error" class="name-error" role="alert" hidden>Isi nama pemain sebelum memulai.</p><button class="primary canva-button" data-action="instructions">Mulai Petualangan <i data-lucide="arrow-right"></i></button></div></div>`;
    if(state.view==="instructions")out=`<div class="panel instructions canva-panel"><p class="eyebrow">Cara bermain</p><h1 id="page-title">Siap berpetualang?</h1><p class="lead" style="margin:auto">Selesaikan empat tantangan di setiap zona untuk memperoleh lencana istimewa.</p><div class="steps"><div class="step canva-card"><b>1</b><span>Pilih salah satu dari tiga zona di peta.</span></div><div class="step canva-card"><b>2</b><span>Baca cerita NPC, lalu pilih tindakan terbaik. Jika belum tepat, coba lagi!</span></div><div class="step canva-card"><b>3</b><span>Kumpulkan poin dan selesaikan semua zona.</span></div></div><button class="primary canva-button" data-action="map">Ayo ke Peta <i data-lucide="map"></i></button></div>`;
    if(state.view==="map")out=`<div class="map-header"><div><p class="eyebrow">Pilih destinasi</p><h1 id="page-title">Peta Dunia Kebaikan</h1><p class="lead">Kamu bebas memulai dari zona mana saja. Setiap pilihan baik membawamu makin dekat ke lencana!</p></div></div><div class="zone-grid">${zones.map((z,i)=>`<article class="zone-card canva-card ${state.done[i]?"done":""}"><div class="icon" aria-hidden="true">${z.icon}</div><h3>${z.name}</h3><span class="zone-status">${state.done[i]?"✓ SELESAI":state.answers[i].length?`${state.answers[i].length}/4 QUEST`:"4 QUEST"}</span><p>${z.subtitle}</p><button class="zone-button canva-button" data-action="enter" data-zone="${i}">${state.done[i]?"Kunjungi Lagi":"Masuk Zona"} →</button></article>`).join("")}</div>${state.done.every(Boolean)?`<div style="margin-top:19px;text-align:center"><button class="primary canva-button" data-action="final">Lihat Lencana & Hasil <i data-lucide="award"></i></button></div>`:""}`;
    if(state.view==="quest"){let z=zones[state.zone],q=z.questions[state.index],answered=!!state.answers[state.zone][state.index],prog=state.answers[state.zone].length;out=`<div class="quest-layout"><div class="quest-board canva-panel"><div class="quest-top"><div class="npc-icon" aria-hidden="true">${z.npcIcon}</div><div><span>${z.name} · Tantangan ${state.index+1} dari 4</span><h2 id="page-title">Quest dari ${z.npc}</h2><span class="canva-text">Pemain: ${esc(state.playerName)}</span></div></div><div class="npc-line">“${z.intro}”</div><div class="question">${esc(q.q)}</div><div class="options">${q.a.map((answer,i)=>`<button class="option canva-button ${answered&&i===q.correct?"correct":""} ${state.feedback?.wrong===i?"wrong":""}" data-action="answer" data-choice="${i}" ${answered?"disabled":""}><span class="option-letter">${"ABCD"[i]}</span><span>${esc(answer)}</span></button>`).join("")}</div>${state.feedback?`<div class="feedback ${state.feedback.good?"good":"try"}" role="status">${state.feedback.good?"✅ ":"💡 "}${esc(state.feedback.text)}</div>`:""}<div class="quest-actions">${answered?`<button class="primary canva-button" data-action="next">${state.index===3?"Selesaikan Zona":"Tantangan Berikutnya"} <i data-lucide="arrow-right"></i></button>`:""}<button class="secondary canva-button" data-action="map"><i data-lucide="map"></i> Kembali ke Peta</button><button class="secondary canva-button" data-action="resetQuest"><i data-lucide="rotate-ccw"></i> Ulang Quest</button></div></div><aside class="side-panel canva-panel"><h3>🎯 Progres Zona</h3><div class="progress-track canva-progress" role="progressbar" aria-valuenow="${prog}" aria-valuemin="0" aria-valuemax="4" aria-label="Progres zona"><div class="progress-fill" style="width:${prog*25}%"></div></div><div class="progress-caption">${prog} dari 4 tantangan selesai</div><p>Jawab dengan cermat. Kamu boleh mencoba lagi jika pilihanmu belum tepat!</p><ul class="mini-list canva-list">${z.questions.map((_,i)=>`<li class="${state.answers[state.zone][i]?"completed":""}">${state.answers[state.zone][i]?"✓":"□"} Tantangan ${i+1}</li>`).join("")}</ul></aside></div>`}
    if(state.view==="zoneDone"){let z=zones[state.zone],all=state.done.every(Boolean);out=`<div class="panel instructions canva-panel"><p class="eyebrow">Quest tuntas! · Pemain: ${esc(state.playerName)}</p><h1 id="page-title">Hebat, ${z.name} selesai! 🎉</h1><p class="lead" style="margin:auto">Kamu sudah mempraktikkan ${z.subtitle.toLowerCase()}. Setiap tindakan baik membuat lingkungan lebih nyaman untuk semua.</p><div class="quest-actions" style="justify-content:center;margin-top:24px"><button class="primary canva-button" data-action="${all?"final":"nextZone"}">${all?"Lihat Hasil & Lencana":"Lanjut ke Zona Berikutnya"} <i data-lucide="arrow-right"></i></button><button class="secondary canva-button" data-action="map"><i data-lucide="map"></i> Kembali ke Peta</button><button class="secondary canva-button" data-action="resetQuest"><i data-lucide="rotate-ccw"></i> Ulang Quest</button></div></div>`}
    if(state.view==="final")out=`<div class="panel complete-layout canva-panel"><div class="badge" role="img" aria-label="Lencana perisai emas dan hijau zamrud dengan bintang dan jabat tangan"><div class="badge-shape"><span class="star">★</span><span class="hands">🤝</span></div></div><div><p class="eyebrow">Semua zona selesai · ${state.score} poin</p><h1 id="page-title">Pahlawan Musyawarah & Norma!</h1><p class="creator-credit canva-text">Pemain: ${esc(state.playerName)}</p><p class="lead">Selamat! Kamu telah membuktikan bahwa sikap baik bisa dipraktikkan di mana saja.</p><ul class="summary-list"><li>Di masyarakat: dengarkan pendapat, hormati mufakat, dan bergotong royong.</li><li>Di sekolah: gunakan hak belajar dan jalankan kewajiban dengan bertanggung jawab.</li><li>Di rumah: berbicara sopan, saling menyayangi, dan membantu keluarga.</li></ul><p id="final-creator-credit" class="creator-credit canva-text">Pembuat: Siti Anggita Agustiani, M.Pd.</p><div class="quest-actions"><button class="primary canva-button" data-action="map">Jelajahi Peta Lagi <i data-lucide="map"></i></button><button class="secondary canva-button" data-action="restart"><i data-lucide="rotate-ccw"></i> Main dari Awal</button></div></div></div>`;
    $("content").innerHTML=out;lucide.createIcons();
  }
  function enterZone(i){state.zone=i;state.index=state.answers[i].length<4?state.answers[i].length:0;state.feedback=null;state.view="quest";render()}
  document.addEventListener("click",e=>{let btn=e.target.closest("[data-action]");if(!btn)return;let action=btn.dataset.action;
    if(action==="instructions"){const input=$("player-name"),name=input.value.trim();if(!name){$("name-error").hidden=false;input.setAttribute("aria-invalid","true");input.focus();return}state.playerName=name;state.view=action;state.feedback=null}
    else if(action==="map"||action==="final"){state.view=action;state.feedback=null}
    else if(action==="enter")return enterZone(Number(btn.dataset.zone));
    else if(action==="answer"){let z=zones[state.zone],q=z.questions[state.index],choice=Number(btn.dataset.choice);if(state.answers[state.zone][state.index])return;if(choice===q.correct){state.answers[state.zone][state.index]=true;state.score+=10;state.feedback={good:true,text:q.good}}else state.feedback={good:false,wrong:choice,text:q.hint}}
    else if(action==="next"){state.feedback=null;if(state.index<3)state.index++;else{state.done[state.zone]=true;state.view="zoneDone"}}
    else if(action==="nextZone"){let next=state.done.findIndex(v=>!v);if(next!==-1)return enterZone(next);state.view="final"}
    else if(action==="resetQuest"){state.score-=state.answers[state.zone].length*10;state.answers[state.zone]=[];state.done[state.zone]=false;state.index=0;state.feedback=null;state.view="quest"}
    else if(action==="restart"){state.view="start";state.zone=0;state.index=0;state.score=0;state.done=[false,false,false];state.answers=[[],[],[]];state.feedback=null}
    render();
  });
  document.addEventListener("input",e=>{if(e.target.id==="player-name"&&e.target.value.trim()){$("name-error").hidden=true;e.target.removeAttribute("aria-invalid")}});
  document.addEventListener("keydown",e=>{if(e.target.id==="player-name"&&e.key==="Enter"){e.preventDefault();document.querySelector('[data-action="instructions"]').click()}});
  render();
</script>
